name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Vérification des types
        run: npm run typecheck

      # Les tests remplacent Claude et Shopify par des doublures : aucune clé API n'est nécessaire.
      - name: Tests
        run: npm test
